['portalGeometryTest': 'compile.PortalGeometryTest',
 'featureDrawContextTest': 'geometry.FeatureDrawContextTest',
 'shadowLightConventionTest': 'runtime.ShadowLightConventionTest',
 'shadowCasterVolumeTest': 'runtime.ShadowCasterVolumeTest',
 'shadowSelectionSnapshotTest': 'runtime.ShadowSelectionSnapshotTest',
 'unusedMipmapsTest': 'runtime.UnusedMipmapsTest',
 'cameraMatrixConventionTest': 'runtime.CameraMatrixConventionTest',
 'shaderFrameProfilerTest': 'runtime.ShaderFrameProfilerTest',
 'blockingPipelineCompilationTest': 'runtime.BlockingPipelineCompilationTest',
 'packProgramsValidationTest': 'runtime.PackProgramsValidationTest'].each { taskName, testClass ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "dev.kausik.shaders.${testClass}"
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        doFirst {
            def pack = providers.gradleProperty('shaderPack').orNull
            if ((taskName == 'packProgramsValidationTest' || taskName == 'shadowLightConventionTest') && pack != null) args pack
        }
    }
    check { dependsOn taskName }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'minecraft_shader_loader_gametest'
        enableGameTests = false
        enableClientGameTests = true
    }
}
loom.runs.clientGameTest {
    vmArg '-Dmetal.enabled=true'
    vmArg '-Xmx4G'
    def selectedPack = providers.gradleProperty('shaderPack').orNull
    if (selectedPack != null) vmArg "-DminecraftShaders.pack=${selectedPack}"
    environmentVariable 'MTL_DEBUG_LAYER', '1'
}
tasks.named('runClientGameTest') {
    def completionMarker = layout.buildDirectory.file('run/clientGameTest/shader-gametest-complete.txt')
    doFirst {
        if (!providers.gradleProperty('shaderPack').isPresent()) {
            throw new GradleException('Supply -PshaderPack=/absolute/path/to/pack.zip')
        }
        completionMarker.get().asFile.delete()
    }
    doLast {
        if (!completionMarker.get().asFile.isFile()) {
            throw new GradleException('Shader client validation did not finish; inspect shader-loader/build/run/clientGameTest/logs/latest.log')
        }
    }
}

loom.runs {
    clientNaturalGameTest {
        inherit clientGameTest
        name 'Shader Pack Natural Terrain Validation'
        runDir 'build/run/clientNaturalGameTest'
        vmArg '-DminecraftShaders.testScenario=natural'
        vmArg '-Dmetal.enabled=true'
        vmArg '-Xmx4G'
        def selectedPack = providers.gradleProperty('shaderPack').orNull
        if (selectedPack != null) vmArg "-DminecraftShaders.pack=${selectedPack}"
        environmentVariable 'MTL_DEBUG_LAYER', '1'
    }
}
tasks.named('runClientNaturalGameTest') {
    def completionMarker = layout.buildDirectory.file('run/clientNaturalGameTest/shader-gametest-complete.txt')
    doFirst {
        if (!providers.gradleProperty('shaderPack').isPresent()) {
            throw new GradleException('Supply -PshaderPack=/absolute/path/to/pack.zip')
        }
        completionMarker.get().asFile.delete()
    }
    doLast {
        if (!completionMarker.get().asFile.isFile()) {
            throw new GradleException('Shader natural-terrain validation did not finish; inspect its client log')
        }
    }
}

