# Canopy 0.2.0: original pack; not an official Mojang product.
screen=SHADOWS PIXEL_SHADOWS shadowMapResolution shadowDistance WATER_REFLECTIONS REFLECTION_STEPS CAUSTICS MATERIAL_HIGHLIGHTS MATERIAL_MAPS BLOOM
profile.BALANCED=SHADOWS PIXEL_SHADOWS WATER_REFLECTIONS CAUSTICS MATERIAL_HIGHLIGHTS MATERIAL_MAPS BLOOM REFLECTION_STEPS=8 shadowMapResolution=1536 shadowDistance=80.0
profile.FAST=SHADOWS PIXEL_SHADOWS !WATER_REFLECTIONS CAUSTICS MATERIAL_HIGHLIGHTS MATERIAL_MAPS BLOOM shadowMapResolution=1024 shadowDistance=64.0
materialPalette=materials.json
program.world0/shadow.enabled=SHADOWS
vignette=false
shadow.translucent=false
shadow.texelSnap=true
uniform.float.canDay=clamp(sin(sunAngle * 6.28318530718) * 4.0 + 0.5, 0.0, 1.0)
uniform.float.canDusk=1.0 - clamp(abs(sin(sunAngle * 6.28318530718)) * 3.0, 0.0, 1.0)
uniform.float.canWarm=smooth(clamp((temperature - 0.65) / 1.35, 0.0, 1.0), 40, 40)
uniform.float.canCold=smooth(clamp((0.4 - temperature) / 0.9, 0.0, 1.0), 40, 40)
uniform.float.canPale=smooth(if(biome == BIOME_PALE_GARDEN, 1.0, 0.0), 40, 40)
uniform.float.canHumid=smooth(if(in(biome, BIOME_JUNGLE, BIOME_SPARSE_JUNGLE, BIOME_BAMBOO_JUNGLE, BIOME_SWAMP, BIOME_MANGROVE_SWAMP), 1.0, 0.0), 40, 40)
alphaTest.shadow=off
alphaTest.gbuffers_clouds=off
