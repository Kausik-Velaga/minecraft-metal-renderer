# Solstice 0.1.0 -- original pack for Minecraft Metal
screen=SHADOWS shadowMapResolution shadowDistance BLOOM
profile.BALANCED=SHADOWS BLOOM shadowMapResolution=1536 shadowDistance=64.0
profile.LITE=!SHADOWS !BLOOM
program.world0/shadow.enabled=SHADOWS
vignette=false
shadow.translucent=false
shadow.texelSnap=true
# CPU custom uniforms are evaluated once per frame.
uniform.float.solDay=clamp(sin(sunAngle * 6.28318530718) * 4.0 + 0.5, 0.0, 1.0)
uniform.float.solDusk=1.0 - clamp(abs(sin(sunAngle * 6.28318530718)) * 3.0, 0.0, 1.0)
alphaTest.shadow=off
alphaTest.gbuffers_clouds=off
