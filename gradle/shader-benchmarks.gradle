def fetchSpark = tasks.register('prepareSparkProfiler') {
    group = 'verification'
    description = 'Fetch the checksum-pinned external Spark profiler for optional packaged diagnostics.'
    outputs.file(sparkJar)
    // Recheck the checksum even when an existing download is reused.
    outputs.upToDateWhen { false }
    doLast {
        if (!sparkJar.isFile()) {
            sparkJar.parentFile.mkdirs()
            def temporary = new File(sparkJar.parentFile, sparkJar.name + '.part')
            try {
                new URI('https://cdn.modrinth.com/data/l6YH9Als/versions/e3hsPc1o/spark-1.10.187-fabric.jar').toURL().withInputStream { input ->
                    temporary.withOutputStream { it << input }
                }
                def hash = MessageDigest.getInstance('SHA-512').digest(temporary.bytes).encodeHex().toString()
                if (hash != sparkChecksum) throw new GradleException('Spark download checksum mismatch')
                Files.move(temporary.toPath(), sparkJar.toPath())
            } finally { temporary.delete() }
        }
        if (MessageDigest.getInstance('SHA-512').digest(sparkJar.bytes).encodeHex().toString() != sparkChecksum)
            throw new GradleException("Spark checksum mismatch: remove ${sparkJar} and retry")
    }
}
