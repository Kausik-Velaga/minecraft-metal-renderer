plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

version = shader_loader_version
group = 'dev.kausik.shaders'
base { archivesName = 'minecraft-shader-loader' }

apply from: rootProject.file('gradle/minecraft-mod.gradle')

dependencies {
    // A separate mod dependency, never bundled into the shader-loader JAR.
    implementation project(':')
    // Loom's shared development Minecraft jar includes Fabric's interface injections.
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    runs {
        client {
            vmArg '-Xmx4G'
            vmArg '-Dmetal.enabled=true'
        }
    }
}

test { failOnNoDiscoveredTests = false }

tasks.register('compatibilityTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.kausik.shaders.compile.ShaderCompatibilityTest'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

['uniformInitializerLiftingTest': 'UniformInitializerLiftingTest',
 'uniformInitializerLiftingGpuTest': 'UniformInitializerLiftingGpuTest'].each { taskName, testClass ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "dev.kausik.shaders.compile.${testClass}"
        jvmArgs '--enable-native-access=ALL-UNNAMED', '-DminecraftShaders.optimizeFragmentSpirv=true',
            '-DminecraftShaders.liftUniformInitializers=false', '-DminecraftShaders.uniformLiftMaxUlp=0'
        environment 'MTL_DEBUG_LAYER', '1'
        def vertexOptimization = providers.gradleProperty('shaderOptimizeVertexSpirv')
        if (vertexOptimization.isPresent())
            jvmArgs "-DminecraftShaders.optimizeVertexSpirv=${vertexOptimization.get()}"
        doFirst {
            def pack = providers.gradleProperty('shaderPack').orNull
            if (pack != null) args pack
        }
    }
    check { dependsOn taskName }
}

tasks.register('terrainGeometryTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.kausik.shaders.geometry.TerrainGeometryTest'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// A locally supplied pack is required; copyrighted shader packs are never bundled or downloaded.
tasks.register('bslShaderSmokeTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.kausik.shaders.compile.PackShaderSmokeTest'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    environment 'MTL_DEBUG_LAYER', '1'
    ['metalIndirectCommandBuffers': 'minecraftMetal.indirectCommandBuffers',
     'shaderEarlyAlphaDemote': 'minecraftShaders.earlyAlphaDemote',
     'shaderOptimizeFragmentSpirv': 'minecraftShaders.optimizeFragmentSpirv',
     'shaderOptimizeVertexSpirv': 'minecraftShaders.optimizeVertexSpirv',
     'shaderTerrainFrameMatrices': 'minecraftShaders.terrainFrameMatrices',
     'shaderHardwareShadowComparison': 'minecraftShaders.hardwareShadowComparison'].each { propertyName, systemName ->
        def value = providers.gradleProperty(propertyName)
        if (value.isPresent()) jvmArgs "-D${systemName}=${value.get()}"
    }
    doFirst {
        def pack = providers.gradleProperty('shaderPack').orNull
        if (pack == null) throw new GradleException('Supply -PshaderPack=/absolute/path/to/pack.zip')
        args pack
    }
}

check { dependsOn 'compatibilityTest', 'terrainGeometryTest' }

