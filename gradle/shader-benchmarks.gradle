def sparkEnabled = providers.gradleProperty('sparkProfiler').getOrElse('false').toBoolean()
def sparkVersion = '1.10.187'
def sparkChecksum = 'c74bf5d5a16b2445ec6ea717eac756412b272a8015e91f91a7bf5a27e6f2f99c4a11878d434510f941f37b0344b3a7d1ba0dd6c34e80642762c48fb6e9a93894'
def sparkJar = rootProject.file(".research/profilers/spark-${sparkVersion}-fabric.jar")
